# R8 Full Mode (default on AGP 8.0+, verify it's NOT set to false)
# android.enableR8.fullMode=false   ← DO NOT include this line

# Optimized resource shrinking (AGP 8.12+ recommended; safe to leave unset on 8.7)
# android.r8.optimizedResourceShrinking=true

# Compose
android.nonTransitiveRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true